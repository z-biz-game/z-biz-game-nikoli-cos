name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 零构建项目也要过语法关：一个语法错的引擎文件在浏览器里只会表现为"点了没反应"。
      - name: 语法自检
        run: npm run check

      - name: 引擎单测 + 无头真指针通关
        run: bash tools/verify.sh
        env:
          WD_TIMEOUT: 420
          # 证据目录不能是点开头的：upload-artifact 底层 glob 默认跳过 dot 目录，
          # 所以以前写 .playtest/ 时十次运行一份都没传上来，而 if-no-files-found: ignore
          # 把这件事说得跟"没有失败"一样。
          SHOT_DIR: ${{ github.workspace }}/verify-shots

      # 复验截图是这仓库的"我看过了"证据，失败时也要留下。
      - name: 上传复验截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest
          path: verify-shots/
          if-no-files-found: error
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs
