name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 零构建项目也要过语法关：一个语法错的引擎文件在浏览器里只会表现为"点了没反应"。
      - name: 语法自检
        run: |
          git ls-files '*.js' '*.mjs' | while read -r f; do
            node --check "$f" || { echo "FAIL $f"; exit 1; }
          done

      - name: 引擎单测 + 无头真指针通关
        run: bash tools/verify.sh
        env:
          WD_TIMEOUT: 420
          # 截图写到 CI 专属目录：.playtest/ 在 .gitignore 里，upload-artifact 十次运行
          # 一次都没传上来过，于是这条"我看过了"的证据其实从来没存在。
          SHOT_DIR: ${{ github.workspace }}/.ci-playtest

      # 复验截图是这仓库的"我看过了"证据，失败时也要留下。
      - name: 上传复验截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest
          path: .ci-playtest/
          if-no-files-found: error
